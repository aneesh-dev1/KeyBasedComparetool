  <title id="tudc-title">TransUnion Data Compare loading</title>
  <desc id="tudc-description">The TU logo appears at once, a dot circles it and it contracts to a dot, then the dot redraws the logo, in a seamless eight-second loop.</desc>
  <!-- The filled badge paths are preserved from the application's TransUnion logo.
       Self-contained: no JavaScript, fonts, external resources or raster assets.
       Prefix tudc IDs when embedding multiple copies inline; img copies are isolated. -->
  <!-- Every animation starts 5.1 s into the loop, just after the logo is fully drawn, so the first frame
       (often all a short wait shows) is the whole logo rather than a lone dot. -->
  <style>
    .tudc-motion { display: inline; }
    .tudc-still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .tudc-motion { display: none; }
      .tudc-still { display: inline; }
    }
  </style>
